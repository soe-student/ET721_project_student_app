{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create account</h2>
    <p class="sub">Join EduHub and start organising your academic life.</p>
    <form method="POST" action="{{ url_for('signup') }}">
      <div class="form-group">
        <label>Username</label>
        <input name="username" class="form-control" placeholder="choose_a_username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input name="email" type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input name="password" type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-full">Create Account</button>
    </form>
    <hr class="divider">
    <p style="text-align:center;font-size:.9rem">Already have an account? <a href="{{ url_for('index') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
